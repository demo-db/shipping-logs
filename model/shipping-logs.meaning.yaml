{
  "format": "meaning/draft-1",
  "id": "shipping-logs",
  "name": "Shipping original logs",
  "description": "Original immutable synthetic JSONL inGitDB collections. Baseline observations, a synthetic carrier-gateway stream with only healthy11038 booking, and explicitly labelled future replay examples remain separate.",
  "license": "CC0-1.0",
  "models": {
    "shipping_logs": "shipping-logs.modelspec.hcl"
  },
  "concepts": [
    {
      "id": "baseline-observation",
      "kind": "entity",
      "description": "An original baseline shipping-process observation, including the Northwind example orders and synthetic control scenarios. These records do not import future recovery examples.",
      "labels": {
        "en": "Baseline shipping observation"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "carrier-gateway-entry",
      "kind": "entity",
      "description": "An original baseline simulated booking request or response for healthy order 11038 only. It is not a real carrier API call or evidence that blocked orders 11045 or 11062 were booked.",
      "labels": {
        "en": "Baseline carrier-gateway entry"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "order11045-recovery-example",
      "kind": "entity",
      "description": "A separately stored shipping-process entry illustrating a possible future replay for order 11045. It is not baseline observation or executed recovery evidence.",
      "labels": {
        "en": "Order 11045 recovery example"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "order11062-recovery-example",
      "kind": "entity",
      "description": "A separately stored shipping-process entry illustrating a possible future replay for order 11062, whose replay is pending. It does not establish that the replay happened.",
      "labels": {
        "en": "Order 11062 recovery example"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "carrier-order11045-recovery-example",
      "kind": "entity",
      "description": "A simulated carrier-gateway entry illustrating a possible future order 11045 replay. It is not an original baseline observation, a real carrier call or proof of physical shipping.",
      "labels": {
        "en": "Order 11045 carrier example"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "carrier-order11062-recovery-example",
      "kind": "entity",
      "description": "A simulated carrier-gateway entry illustrating a possible future order 11062 replay. It does not establish an executed replay, real booking or physical shipping.",
      "labels": {
        "en": "Order 11062 carrier example"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "attempt-reference",
      "kind": "attribute",
      "description": "An attempt identifier referring to the Shipping attempt concept. Baseline IDs can correspond to recorded attempts; future example IDs need not exist in the Shipping baseline. This semantic reference creates no cross-database foreign key.",
      "labels": {
        "en": "Shipping attempt reference"
      },
      "values-of": "meaning://github.com/demo-db/shipping/shipping-attempt?ref=03a158c07bb726ac2c4ad7f524bddf696ac2e6bb",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "attempt_id"
        }
      ]
    },
    {
      "id": "request-reference",
      "kind": "attribute",
      "description": "The shipping request identifier carried by the simulated carrier-gateway message. This declares the identifier meaning without asserting a SQL join or a completed carrier assignment.",
      "labels": {
        "en": "Shipping request reference"
      },
      "values-of": "meaning://github.com/demo-db/shipping/shipping-request?ref=03a158c07bb726ac2c4ad7f524bddf696ac2e6bb",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "request_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "request_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "request_id"
        }
      ]
    },
    {
      "id": "order-reference",
      "kind": "attribute",
      "description": "The scenario order identifier associated with the log entry. Orders 11038, 11045 and 11062 reuse Northwind order identifiers; 90001–90005 are synthetic controls that need not resolve to Northwind rows. This semantic reference creates no enforced foreign key or automatic join.",
      "labels": {
        "en": "Scenario order reference"
      },
      "values-of": "meaning://github.com/meaninggraph/core/order?ref=982916d73f0a35ff2558b0062f58aa3ac4f24d97",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "order_id"
        }
      ]
    },
    {
      "id": "event-kind",
      "kind": "attribute",
      "description": "The kind of synthetic observation, such as request-created, replay-started or booking-confirmed. A kind found in a recovery-example collection remains illustrative.",
      "labels": {
        "en": "Event kind"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "kind"
        }
      ]
    },
    {
      "id": "event-time",
      "kind": "attribute",
      "description": "The timestamp recorded for the synthetic observation, qualified by clock_domain and precision_ms. A future example timestamp does not establish that an action occurred.",
      "labels": {
        "en": "Event time"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "occurred_at"
        }
      ]
    },
    {
      "id": "clock-domain",
      "kind": "attribute",
      "description": "The clock whose timestamps the record uses. Clock domains must be considered before comparing event times across streams.",
      "labels": {
        "en": "Clock domain"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "clock_domain"
        }
      ]
    },
    {
      "id": "event-sequence",
      "kind": "attribute",
      "description": "The recorded event order within a stream and attempt. Sequence numbers are not a global order across collections or a substitute for clock-domain-aware time comparisons.",
      "labels": {
        "en": "Event sequence"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "sequence"
        }
      ]
    },
    {
      "id": "correlation-id",
      "kind": "attribute",
      "description": "The scenario identifier relating a gateway exchange to its Shipping request. It correlates records without proving successful processing.",
      "labels": {
        "en": "Correlation identifier"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "correlation_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "correlation_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "correlation_id"
        }
      ]
    },
    {
      "id": "booking-status",
      "kind": "attribute",
      "description": "An optional status on a simulated carrier response. A booked status in a recovery example is illustrative and does not establish an executed replay or a real shipment.",
      "labels": {
        "en": "Simulated booking status"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "booking_status"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "booking_status"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "booking_status"
        }
      ]
    },
    {
      "id": "booking-reference",
      "kind": "attribute",
      "description": "An optional reference returned by the synthetic booking simulation. Example references are not evidence of a real booking, carrier call or shipment.",
      "labels": {
        "en": "Simulated booking reference"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "booking_reference"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "booking_reference"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "booking_reference"
        }
      ]
    }
  ]
}
