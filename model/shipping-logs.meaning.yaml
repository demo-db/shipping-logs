        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "booking_status"
        }
      ]
    },
    {
      "id": "booking-reference",
      "kind": "attribute",
      "description": "An optional reference returned by the synthetic booking simulation. Example references are not evidence of a real booking, carrier call or shipment.",
      "labels": {
        "en": "Simulated booking reference"
      },
      "of": "carrier-gateway-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "booking_reference"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "booking_reference"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "booking_reference"
        }
      ]
    }
  ]
}
