{
  "format": "meaning/draft-1",
  "id": "shipping-logs",
  "name": "Shipping original logs",
  "description": "Original immutable synthetic JSONL inGitDB collections. Baseline observations, a synthetic carrier-gateway stream with only healthy11038 booking, and explicitly labelled future replay examples remain separate.",
  "license": "CC0-1.0",
  "models": {
    "shipping_logs": "shipping-logs.modelspec.hcl"
  },
  "concepts": [
    {
      "id": "shipping-log-entry",
      "kind": "entity",
      "description": "One immutable synthetic JSONL observation. Event IDs and sequences belong to their stream and attempt context; source collections keep observed baseline and future recovery examples separate.",
      "labels": {
        "en": "Shipping log entry"
      },
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "identifier",
          "property": "event_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "identifier",
          "property": "event_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "identifier",
          "property": "event_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "identifier",
          "property": "event_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "identifier",
          "property": "event_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "identifier",
          "property": "event_id"
        }
      ]
    },
    {
      "id": "baseline-observation",
      "kind": "entity",
      "description": "An observation in the original baseline streams. The carrier-gateway baseline contains only the healthy order 11038 booking; it is not evidence that blocked orders 11045 or 11062 were booked.",
      "labels": {
        "en": "Baseline observation"
      },
      "extends": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "entity"
        }
      ]
    },
    {
      "id": "carrier-gateway-entry",
      "kind": "entity",
      "description": "A simulated outbound booking request or response in a carrier-gateway stream. These synthetic entries represent neither a real carrier API call nor physical shipping; future replay streams remain examples.",
      "labels": {
        "en": "Carrier gateway log entry"
      },
      "extends": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "entity"
        }
      ]
    },
    {
      "id": "recovery-example",
      "kind": "entity",
      "description": "A separately stored illustration of a possible future replay for blocked orders 11045 or 11062. These records are not baseline observations, executed recovery evidence, or proof that the pending 11062 replay happened.",
      "labels": {
        "en": "Recovery log example"
      },
      "extends": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "entity"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "entity"
        }
      ]
    },
    {
      "id": "attempt-reference",
      "kind": "attribute",
      "description": "An attempt identifier referring to the Shipping attempt concept. Baseline IDs can correspond to recorded attempts; future example IDs need not exist in the Shipping baseline. This semantic reference creates no cross-database foreign key.",
      "labels": {
        "en": "Shipping attempt reference"
      },
      "values-of": "meaning://github.com/demo-db/shipping/shipping-attempt?ref=e629bd76a15ed522d07e2ddd3a83fbff5f2dc38a",
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "attempt_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "attempt_id"
        }
      ]
    },
    {
      "id": "request-reference",
      "kind": "attribute",
      "description": "The shipping request identifier carried by the simulated carrier-gateway message. This declares the identifier meaning without asserting a SQL join or a completed carrier assignment.",
      "labels": {
        "en": "Shipping request reference"
      },
      "values-of": "meaning://github.com/demo-db/shipping/shipping-request?ref=e629bd76a15ed522d07e2ddd3a83fbff5f2dc38a",
      "of": "carrier-gateway-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "request_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "request_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "request_id"
        }
      ]
    },
    {
      "id": "order-reference",
      "kind": "attribute",
      "description": "The Northwind order identifier associated with the log entry. Matching this identifier provides cross-dataset context, not an enforced foreign key or an automatic join.",
      "labels": {
        "en": "Northwind order reference"
      },
      "values-of": "meaning://github.com/meaninggraph/core/order?ref=982916d73f0a35ff2558b0062f58aa3ac4f24d97",
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "order_id"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "order_id"
        }
      ]
    },
    {
      "id": "event-kind",
      "kind": "attribute",
      "description": "The kind of synthetic observation, such as request-created, replay-started or booking-confirmed. A kind found in a recovery-example collection remains illustrative.",
      "labels": {
        "en": "Event kind"
      },
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "kind"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "kind"
        }
      ]
    },
    {
      "id": "event-time",
      "kind": "attribute",
      "description": "The timestamp recorded for the synthetic observation, qualified by clock_domain and precision_ms. A future example timestamp does not establish that an action occurred.",
      "labels": {
        "en": "Event time"
      },
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "occurred_at"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "occurred_at"
        }
      ]
    },
    {
      "id": "clock-domain",
      "kind": "attribute",
      "description": "The clock whose timestamps the record uses. Clock domains must be considered before comparing event times across streams.",
      "labels": {
        "en": "Clock domain"
      },
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "clock_domain"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "clock_domain"
        }
      ]
    },
    {
      "id": "event-sequence",
      "kind": "attribute",
      "description": "The recorded event order within a stream and attempt. Sequence numbers are not a global order across collections or a substitute for clock-domain-aware time comparisons.",
      "labels": {
        "en": "Event sequence"
      },
      "of": "shipping-log-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.baseline",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11045example",
          "role": "value",
          "property": "sequence"
        },
        {
          "model": "modelspec:///shipping_logs.recovery11062example",
          "role": "value",
          "property": "sequence"
        }
      ]
    },
    {
      "id": "correlation-id",
      "kind": "attribute",
      "description": "The scenario identifier relating a gateway exchange to its Shipping request. It correlates records without proving successful processing.",
      "labels": {
        "en": "Correlation identifier"
      },
      "of": "carrier-gateway-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "correlation_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
          "property": "correlation_id"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11062example",
          "role": "value",
          "property": "correlation_id"
        }
      ]
    },
    {
      "id": "booking-status",
      "kind": "attribute",
      "description": "An optional status on a simulated carrier response. A booked status in a recovery example is illustrative and does not establish an executed replay or a real shipment.",
      "labels": {
        "en": "Simulated booking status"
      },
      "of": "carrier-gateway-entry",
      "bindings": [
        {
          "model": "modelspec:///shipping_logs.carrierGateway",
          "role": "value",
          "property": "booking_status"
        },
        {
          "model": "modelspec:///shipping_logs.carrierGatewayRecovery11045example",
          "role": "value",
